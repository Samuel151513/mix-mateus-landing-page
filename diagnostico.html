<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Diagnóstico Mix Mateus</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 800px; margin: 0 auto; }
        .test { margin: 20px 0; padding: 15px; border: 2px solid #ddd; border-radius: 8px; }
        .success { border-color: green; background: #e8f5e9; }
        .error { border-color: red; background: #ffebee; }
        img { max-width: 300px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Diagnóstico Mix Mateus</h1>
    
    <div class="test" id="test-logo">
        <h2>Logo Mix Mateus</h2>
        <img src="./logo-mix-mateus.png" alt="Logo" onerror="this.parentElement.classList.add('error'); this.style.display='none';" onload="this.parentElement.classList.add('success');">
        <p id="logo-result">Testando...</p>
    </div>
    
    <div class="test" id="test-hero">
        <h2>Imagem do Casal</h2>
        <img src="./assets/Happy_couple_Mix_Mateus_card_approval_770ee240-CNrgi5Vf.png" alt="Casal" onerror="this.parentElement.classList.add('error'); this.style.display='none';" onload="this.parentElement.classList.add('success');">
    </div>
    
    <div class="test" id="test-css">
        <h2>CSS</h2>
        <p id="css-result">Testando...</p>
    </div>
    
    <div class="test" id="test-js">
        <h2>JavaScript</h2>
        <p id="js-result">Testando...</p>
    </div>

    <script>
        fetch('./assets/index-BE-s8Z0w.css').then(r => {
            document.getElementById('css-result').innerHTML = r.ok ? '✅ OK' : '❌ Erro';
            document.getElementById('test-css').classList.add(r.ok ? 'success' : 'error');
        });
        
        fetch('./assets/index-l7Kil_VN.js').then(r => {
            document.getElementById('js-result').innerHTML = r.ok ? '✅ OK' : '❌ Erro';
            document.getElementById('test-js').classList.add(r.ok ? 'success' : 'error');
        });
        
        document.getElementById('logo-result').innerHTML = '✅ Logo carregada!';
    </script>
</body>
</html>
